[project]
name = "course-work-2"
version = "0.1.0"
description = ""
authors = [
    {name = "Ann Molochko",email = "molochkoannav@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "pytest (>=9.1.1,<10.0.0)"
    
]


[tool.poetry]
packages = [{include = "course_work_2", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "flake8 (>=7.3.0,<8.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "mypy (>=2.1.0,<3.0.0)"
]

dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]

[tool.black]
line-length = 119
extend-exclude = '''
/(
    \.git
    | __pycache__
    | venv
    | \.venv
)/
'''


[tool.isort]
line_length = 119
profile = "black"
force_single_line = true

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude =  ['venv', '.venv']
